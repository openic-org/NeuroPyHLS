# Recordings downloaded by `neuropyhls fetch` into data/<name>/ (git-ignored).
# Each entry needs: name, url, sha256, filename, license, note.
# Recordings are never committed to git and never processed on the public docs site.
#
# [[dataset]]
# name = "example"
# url = "https://example.org/recording.nwb"
# sha256 = "<64 hex characters>"
# filename = "recording.nwb"
# license = "CC-BY-4.0"
# note = "What it is and which kernels use it."

[[dataset]]
name = "quiroga-simulator"
url = "https://ndownloader.figshare.com/files/21819066"
sha256 = "de64fbf16d03eb4c0d3d1238dab16f91fe0c9dfb616a2fb4751617031bfe39d8"
filename = "Simulator.zip"
license = "CC-BY-4.0"
note = """\
Quian Quiroga simulated extracellular recordings (Martinez et al. 2009, J Neurosci Methods, \
doi:10.1016/j.jneumeth.2009.08.017; Univ. of Leicester figshare 11897595). Zip of 24 \
single-channel .mat recordings at 24 kHz (23 of 60 s plus a short Easy1 excerpt) with \
ground-truth spike times and classes: Easy1/2, Difficult1/2, Burst, Drift; noise 0.05-0.4. \
Ground-truth times lead the spike peak by ~0.9 ms. \
For the bandpass + threshold-crossing detection kernel."""
